<style>
/*
VOICE: Arbeitswerkzeug im Proberaum – knapp, klar, gut lesbar auf Handy und Laptop.
IDEA: die Setliste, die am Bühnenrand klebt – Nummern groß, Reihenfolge per Griff.
PICTURE: die Setliste selbst als Hauptfläche, Gesamtdauer groß daneben.
COLOUR and TYPE: Bühnenschwarz #121212, Logo-Gold #D9A232, Hellgold #EACE81; Bebas Neue + Barlow (wie Termin-App/Homepage).
LAYOUT: links Auftritte, rechts Set-Editor mit Tabs; unter 900px gestapelt.
*/
:root{color-scheme:dark;--bg:#121212;--panel:#1a1a1a;--panel2:#222;--line:#333;--line2:#484848;--ink:#F6F4EF;--mut:#a9a49a;--gold:#D9A232;--gold2:#EACE81;--bronze:#A8661A;--red:#e0584f;--blue:#5aa2e6;--ok:#7fbf7a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;padding:10px max(3vw,14px);border-bottom:2px solid var(--gold);background:#0d0d0d;position:sticky;top:0;z-index:20}
.top img{height:52px;width:auto}
.top h1{font:400 34px/1 'Bebas Neue',sans-serif;color:var(--gold);margin:0;letter-spacing:.02em}
.top .sp{flex:1}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.pill.ok{border-color:#3b5a38;color:var(--ok)}.pill.busy{border-color:var(--bronze);color:var(--gold2)}.pill.warn{border-color:#6b3430;color:#f0a09a}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 74px)}
aside{border-right:1px solid #4d3d18;padding:16px 14px;background:linear-gradient(180deg,#2c2411 0%,#221c0e 55%,#1c170c 100%)}
aside .gi{background:rgba(0,0,0,.28);border-color:#4d3d18}aside .gi:hover{border-color:#7a6227}
aside .gi.on{background:#3e3113;border-color:var(--gold)}
aside .btn{background:rgba(0,0,0,.3);border-color:#5a4720}aside .btn:hover{border-color:var(--gold)}
aside .helpbox{color:#bdb29a}
details.sec{margin:0 0 18px}
details.sec>summary{list-style:none;pointer-events:none;display:block}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .st{display:block;font:400 22px/1 'Bebas Neue';color:var(--gold);margin:6px 0 10px;letter-spacing:.03em}
details.sec .ss{display:none}
.mback{display:none}
aside h2{font:400 22px/1 'Bebas Neue';color:var(--gold);margin:6px 0 10px;letter-spacing:.03em}
.gl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.gi{display:block;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
.gi b{display:block;font-weight:600}.gi small{color:var(--mut)}
.gi.on{border-color:var(--gold);background:#231c0c}
.gi.past{opacity:.6}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.g{background:var(--gold);color:#121212;border-color:var(--gold);font-weight:700}
.btn.g:hover{background:var(--gold2)}
.btn.s{min-height:32px;padding:4px 9px;font-size:14px}
.btn.d{border-color:#6b3430;color:#f0a09a}
.btn.full{width:100%;justify-content:center}
.ib{background:none;border:1px solid transparent;border-radius:6px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--mut);padding:0}
.ib:hover{border-color:var(--line2);color:var(--ink)}
.ib svg{width:18px;height:18px}
main{padding:18px max(2.5vw,14px) 60px}
.muted{color:var(--mut)}
.fields{display:grid;grid-template-columns:2fr 1fr 1.4fr 1.4fr;gap:10px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
input.in,select.in,textarea.in{background:#0f0f0f;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:16px;color:var(--ink);min-height:40px;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--gold);outline:none}
.gname{font:400 40px/1.05 'Bebas Neue';color:var(--ink);background:none;border:none;border-bottom:1px dashed var(--line2);padding:2px 0;width:100%;letter-spacing:.02em}
.gname:focus{outline:none;border-bottom-color:var(--gold)}
.sum{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;padding:14px 16px;background:linear-gradient(90deg,#231c0c,#171717);border:1px solid #3a2e12;border-radius:12px;margin:6px 0 16px}
.big{font:400 52px/0.9 'Bebas Neue';color:var(--gold)}
.sum .k{font-size:13px;color:var(--mut)}
.sum .v{font-size:20px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 14px;min-height:44px;color:var(--mut)}
.tab b{font:400 20px/1 'Bebas Neue';letter-spacing:.03em;color:var(--ink);margin-right:6px}
.tab.on{background:var(--panel);border-color:var(--gold);color:var(--gold2)}
.tab.on b{color:var(--gold)}
.setbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.setbar label.f{width:auto}
.setbar .w1{width:170px}.setbar .w2{width:110px}
.meter{flex:1 1 260px;min-width:220px}
.sbar{position:relative;display:flex;border-radius:9px;background:#2a2a2a;overflow:visible;margin-top:6px}
.sbar i{display:block;height:100%}.sbar i.mu{background:var(--gold);border-radius:9px 0 0 9px}.sbar i.an{background:#c9c6c0}
.sbar i:last-of-type{border-radius:0 9px 9px 0}.sbar i.mu:last-of-type{border-radius:9px}
.sbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transform:translateX(-1px)}
.rest{display:inline-block;border:1px solid;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.mx{padding-top:8px}.mixb{white-space:nowrap;background:none;border:1px solid var(--line2);color:var(--mut);border-radius:4px;font-size:11px;line-height:1;padding:3px 5px;font-weight:500}
.mixb:hover,.mixb.on{border-color:var(--gold);color:var(--gold2)}
.row.flash{box-shadow:0 0 0 3px var(--gold);transition:box-shadow .3s}
.row[data-mix]{cursor:pointer}tr[data-par]{cursor:pointer}
.tcheck{font-size:14px;color:var(--mut);width:100%;margin-top:2px}
.glist{display:flex;flex-direction:column;gap:8px;max-width:860px}
.gh{cursor:pointer;align-items:center!important;flex-wrap:wrap}.ovc:not(.open) .gh{background:var(--panel);border-bottom:none}
.ovc:not(.open):hover{border-color:var(--gold)}
body.ro .ed,body:not(.su) .su{display:none!important}
body.ro main .acts,body.ro main .hd,body.ro main .addbar,body.ro main .picker,body.ro main [data-a="dupset"],body.ro main [data-a="saveg"],body.ro main [data-a="delset"],body.ro main [data-a="dupgig"],body.ro main [data-a="delgig"],body.ro main [data-a="addset"],body.ro main [data-gset],body.ro main .chips .x,body.ro main [data-a="decide"],body.ro main [data-a="splitall"]{display:none!important}
body.ro main .row{grid-template-columns:30px 62px minmax(0,1fr) 52px 70px 52px}
body.ro main .row>.hd{display:none}
.frei{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px;padding:10px 14px;border-radius:10px;border:1px dashed var(--line2);font-size:14px}
.frei.on{border:1px solid #3b5a38;background:#141a14;color:var(--ok)}
.acc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;max-width:640px}
.acc .h{font-size:13px;color:var(--mut)}
.acc label{display:flex;gap:6px;align-items:center;font-size:14px;min-height:40px}
.acc input{width:20px;height:20px;accent-color:var(--gold)}
.vwrap{grid-column:4/-1;min-width:0}
.vote{margin-top:8px;border:1px solid #3a2e12;background:#16130b;border-radius:10px;padding:12px 14px;max-width:880px}
a.btn{color:inherit;text-decoration:none}
.vh{font-size:13px;color:var(--mut);margin-bottom:6px}.vh b{color:var(--gold)}
.vsum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mut)}

{
/* ---------- Grundlagen ---------- */
const BAND=['Carina','Chrissi','Christoph','Fabian','Marla','Michael','Schüh','Wiggi','Alle'];

const fmt=s=>{if(s==null||isNaN(s))return '';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${p2(m)}:${p2(x)}`:`${m}:${p2(x)}`};

const parseDur=v=>{v=String(v||'').trim().replace(',','.');if(!v)return null;
  if(/^\d+(\.\d+)?$/.test(v))return Math.round(parseFloat(v)*60);
  const p=v.split(':').map(Number);if(p.some(isNaN))return undefined;

const normN=v=>{let s=String(v??'').trim();if(/^\d+$/.test(s)&&s.length<3)s=s.padStart(3,'0');return s};

function songDur(n,ex=[]){
  const ks=kids[n]||[];
  if(!ks.length)return{d:dOwn(n),est:false};
  const inc=ks.filter(k=>!ex.includes(k));const kd=inc.map(dOwn);

  const p=dOwn(n);
  if(p!=null)return ex.length?{d:p*inc.length/ks.length,est:true}:{d:p,est:false};
  const kn=kd.filter(x=>x!=null);
  return kn.length?{d:kn.reduce((a,b)=>a+b,0)/kn.length*inc.length,est:true}:{d:null,est:false};
}
const optN=it=>it.opts?.[it.sel||0];
function itemDur(it,n){if(it.kind==='song')return songDur(n??optN(it),[]);return{d:typeof it.d==='number'?it.d:null,est:false}}

    if(it.kind==='song'&&it.opts.length>1){disc++;const ds=it.opts.map(n=>itemDur(it,n).d||0);mn+=Math.min(...ds);mx+=Math.max(...ds)}else{mn+=r.d||0;mx+=r.d||0}}

  return{t:t+extra,mn:mn+extra,mx:mx+extra,miss,disc,est,ansP,extra,said,music}}

function queue(key,fn,ms=700){
  if(store.mode!=='db')return;
  clearTimeout(store.timers[key]);
  store.timers[key]=setTimeout(()=>{delete store.timers[key];store.pend[key]=(store.pend[key]||0)+1;
    store.chain[key]=(store.chain[key]||Promise.resolve()).then(fn).catch(e=>{
      const m=(e&&(e.message||e.code))||'Fehler';
      toast(/row-level|permission|policy/i.test(m)?'Dafür fehlen dir die Rechte.':'Speichern fehlgeschlagen ('+m+')');
    }).finally(()=>{if(!--store.pend[key])delete store.pend[key];setStatus()});setStatus()},ms);setStatus()}
/* sofort speichern (z. B. vor einer Push-Nachricht) */
async function flush(key){if(store.timers[key]){/* Timer vorziehen */const t=store.timers[key];clearTimeout(t);delete store.timers[key];}
  const f=FLUSH[key];if(f){delete FLUSH[key];store.pend[key]=(store.pend[key]||0)+1;store.chain[key]=(store.chain[key]||Promise.resolve()).then(f).catch(e=>toast('Speichern fehlgeschlagen ('+(e.message||e)+')')).finally(()=>{if(!--store.pend[key])delete store.pend[key];setStatus()})}
  await store.chain[key]}
const FLUSH={};
function q2(key,fn,ms){FLUSH[key]=fn;queue(key,()=>{delete FLUSH[key];return fn()},ms)}

function rebuildGig(id){const t=TERMINE.find(x=>x.id===id);const d=GIGDOCS[id];
  if(!t){if(d&&d.frei){S.gigs[id]=clone(d)}else delete S.gigs[id];return}
  if(!d&&!canEditSL()){delete S.gigs[id];return}
  const g=d?clone(d):{id,ort:t.titel||'',veranst:'',freigabe:false,sets:[{id:'b1',name:'Block 1',start:t.von||'',soll:t.von&&t.bis?Math.max(5,Math.round(((+t.bis.slice(0,2)*60+ +t.bis.slice(3,5))-(+t.von.slice(0,2)*60+ +t.von.slice(3,5))+1440)%1440/5)*5):60,ans:10,items:[]}],upd:0};
  Object.assign(g,{id,termin:true,name:t.titel||'Auftritt',date:t.datum||'',from:t.von||'',to:t.bis||'',platz:t.ort||''});delete g.frei;
  if(!g.sets||!g.sets.length)g.sets=[{id:'b1',name:'Block 1',start:'',soll:60,ans:10,items:[]}];
  S.gigs[id]=g}
function rebuildAll(){const ids=new Set([...TERMINE.map(t=>t.id),...Object.keys(GIGDOCS)]);for(const id of Object.keys(S.gigs))if(!ids.has(id))delete S.gigs[id];for(const id of ids)if(!busyKey('g:'+id))rebuildGig(id);
  if(ui.gig&&!S.gigs[ui.gig])ui.gig=null;if(!ui.gig)pickDefault()}
function applyDoc(pfad,daten){const i=pfad.indexOf('/');const k=pfad.slice(0,i),id=pfad.slice(i+1);
  if(k==='lib'){if(busyKey('lib'))return;S.lib=daten&&daten.items?daten:{items:[],file:'',at:''};index()}
  else if(k==='info'){if(busyKey('i:'+id))return;if(daten)S.info[id]=daten;else delete S.info[id]}
  else if(k==='genres'){if(busyKey('ge:'+id))return;if(daten)S.genres[id]=daten;else delete S.genres[id]}
  else if(k==='votes'){if(busyKey('v:'+id))return;if(daten)S.votes[id]=daten;else delete S.votes[id]}
  else if(k==='gigs'){if(busyKey('g:'+id))return;if(daten)GIGDOCS[id]=daten;else delete GIGDOCS[id];rebuildGig(id);if(ui.gig&&!S.gigs[ui.gig])ui.gig=null}}
async function loadTermine(){const today=new Date(Date.now()-400*864e5).toISOString().slice(0,10);

  if(error)throw error;TERMINE=data||[]}
async function loadDocs(){const all=[];let from=0;for(;;){const{data,error}=await sb.from('setlisten_docs').select('pfad,daten').order('pfad').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break;from+=1000}
  S={lib:{items:[],file:'',at:''},info:{},gigs:{},genres:{},votes:{}};GIGDOCS={};
  for(const r of all){const k=r.pfad.split('/')[0];if(k==='gigs')GIGDOCS[r.pfad.slice(5)]=r.daten;else applyDoc(r.pfad,r.daten)}
  index()}

  const set=SET();
  const all=g.sets.map(setStats);const tot=all.reduce((a,s)=>a+s.t,0);

  const disc=all.reduce((a,s)=>a+s.disc,0),miss=all.reduce((a,s)=>a+s.miss,0);
  const mn=all.reduce((a,s)=>a+s.mn,0),mx=all.reduce((a,s)=>a+s.mx,0);
  m.innerHTML=`
  ${g.termin?`<h2 class="gname" style="border:none">${esc(g.name)}</h2>`:`<input class="gname" data-g="name" value="${esc(g.name)}" aria-label="Name des Auftritts">`}

    <label class="f">Beginn<input class="in" type="time" data-g="from" value="${esc(g.from||'')}" ${g.termin?'disabled title="aus der Termin-App"':''}></label>
    <label class="f">Ende<input class="in" type="time" data-g="to" value="${esc(g.to||'')}" ${g.termin?'disabled title="aus der Termin-App"':''}></label>
    <label class="f">Veranstaltung<input class="in" data-g="ort" value="${esc(g.ort)}" placeholder="z. B. Laupheim Kinderfest"></label>
    <label class="f">Veranstalter<input class="in" data-g="veranst" value="${esc(g.veranst)}" placeholder="für die GEMA-Meldung"></label>
    <label class="f">Dateiname dieses Blocks<input class="in" value="${esc(fileBase(g,set))}" readonly></label>
  </div>
  ${g.termin?`<p class="helpbox" style="margin:-6px 0 10px">Titel, Datum und Uhrzeit kommen aus der Termin-App${g.platz?' · Ort: '+esc(g.platz):''}. <a href="./#/t/${g.id}" style="color:var(--gold2)">Zum Termin</a></p>`:''}
  ${canEditSL()?`<div class="frei ${g.freigabe?'on':''}">${g.freigabe?'✓ Für die Band freigegeben – alle Mitglieder sehen diese Setliste.':'Noch nicht freigegeben – nur Christoph, Michael und Bearbeiter sehen diese Setliste.'}
    <button class="btn s ${g.freigabe?'':'g'}" data-a="frei">${g.freigabe?'Freigabe zurücknehmen':'Für die Band freigeben'}</button>${g.freigabe?'<button class="btn s" data-a="freipush">Band per Push informieren</button>':''}</div>`:''}
  <div class="sum">
    <div><div class="k">Gesamt (alle Sets)</div><div class="big">${fmt(tot)||'0:00'}</div></div>
    <div><div class="k">davon Musik</div><div class="v">${fmt(music)||'0:00'}</div></div>
    <div><div class="k">Ansagen</div><div class="v">${fmt(all.reduce((x,s)=>x+s.ansP,0))||'0:00'}</div></div>
    ${rest(tot,g.sets.reduce((a,s)=>a+(s.soll||0)*60,0),true)}
    ${disc?`<div><div class="k">Spanne je nach Auswahl</div><div class="v">${fmt(mn)} – ${fmt(mx)}</div></div>`:''}

      <div class="sd">Musik ${fmt(st.music)||'0:00'} · Ansagen ${fmt(st.t-st.music)||'0:00'}${tm?' · '+tm.from+'–'+tm.to:''}</div>${durBar(st,so,8)}<div style="margin-top:6px">${rest(st.t,so)||'<span class="sd">kein Soll</span>'}</div></button>`}).join('')}</div>
  </div>

  </div>`;
}

function setView(g,set,st){
  let clock=null;if(set.start){const [h,mi]=set.start.split(':').map(Number);clock=h*3600+mi*60}
  const soll=(set.soll||0)*60;const pct=soll?Math.min(100,st.t/soll*100):0;
  let pos=0;
  const rows=set.items.map((it,i)=>{const r=itemDur(it);const c=clock!=null?fmt(clock%86400).replace(/:\d\d$/,'')+'':'';
    const clk=clock!=null?`${p2(Math.floor(clock/3600)%24)}:${p2(Math.floor(clock%3600/60))}`:'';
    if(clock!=null&&r.d!=null)clock+=r.d;
    return rowView(it,i,r,clk,it.kind==='note'?'':++pos,g,set)}).join('');
  return `<div class="setbar">
    <label class="f w1">Name des Sets<input class="in" data-s="name" value="${esc(set.name)}"></label>
    <label class="f w2">Beginn<input class="in" type="time" data-s="start" value="${esc(set.start||'')}"></label>
    <label class="f w2">Soll-Dauer<select class="in" data-s="soll"><option value="0">kein Soll</option>${Array.from({length:48},(_,i)=>(i+1)*5).map(v=>`<option value="${v}" ${(set.soll||0)===v?'selected':''}>${v>=60?Math.floor(v/60)+':'+p2(v%60)+' h':v+' min'}</option>`).join('')}${set.soll&&set.soll%5?`<option value="${set.soll}" selected>${set.soll} min</option>`:''}</select></label>
    <label class="f w2">Ansagen<select class="in" data-s="ans">${[0,5,10,15,20,25,30].map(v=>`<option value="${v}" ${(set.ans??10)===v?'selected':''}>${v?v+' min':'keine'}</option>`).join('')}</select></label>
    <div class="meter"><div class="muted" style="font-size:14px">Musik ${fmt(st.music)||'0:00'} + Ansagen ${fmt(st.ansP)||'0:00'}${st.said?` (davon ${fmt(Math.min(st.said,st.ansP))} geplant)`:''} = Block <b style="color:var(--ink);font-size:18px">${fmt(st.t)||'0:00'}</b>${st.est?' <span class="tag">teils geschätzt</span>':''}${soll?` · Soll ${fmt(soll)} ${rest(st.t,soll)}`:''}${st.disc?` · je nach Auswahl ${fmt(st.mn)}–${fmt(st.mx)}`:''}</div>${durBar(st,soll,10)}<div class="legend"><span>Musik</span><span class="an">Ansagen/Pausen</span>${soll?'<span class="so">Soll</span>':''}</div></div>
    <button class="btn s" data-a="dupset">Set duplizieren</button>
    <button class="btn s" data-a="saveg">Block speichern</button>
    <button class="btn s d" data-a="delset">${ui.confirm==='set'?'Wirklich löschen?':'Set löschen'}</button>
  </div>
  <div class="list" id="list">${rows||'<div class="empty" style="padding:18px">Noch leer – unten Nummern eingeben, z. B. <b style="display:inline;font-size:22px">134 188 203/156 900</b></div>'}</div>
  <div class="addbar" id="addbar">
    ${ui.alt?`<div class="althint">Alternative hinzufügen zu Position ${SET().items.findIndex(x=>x.id===ui.alt)+1} – Stück suchen und auswählen · <button class="btn s" data-a="altcancel">Abbrechen</button></div>`:''}
    <input class="in q" id="q" placeholder="${ui.alt?'Alternative: Nummer oder Titel':'Nummer oder Titel … (mehrere: 134 188, Alternativen: 203/156)'}" value="${esc(ui.q)}" autocomplete="off">
    ${!ui.alt&&genreList().length?`<select class="in" data-gins style="width:auto;min-height:32px;padding:4px 8px;font-size:14px"><option value="">Gespeicherten Block einfügen …</option>${genreList().map(gb=>`<option value="${gb.id}">${esc(gb.name)} · ${gb.items.length} Stücke · ${fmt(gDur(gb).t)||'0:00'}</option>`).join('')}</select>`:''}
    <button class="btn s ${ui.pick?'g':''}" data-a="picker">${ui.pick?'Liste schließen':'Aus Liste wählen'}</button>
    ${ui.alt?'':`<button class="btn s" data-a="addnote">${ICON.note.replace('<svg','<svg width="16" height="16"')} Ansage</button><button class="btn s" data-a="addpause">+ Pause</button><button class="btn s" data-a="addfree">+ Freier Titel</button>`}
    <div class="drop hide" id="drop"></div>
  </div>
  ${ui.pick?`<div class="picker"><div class="pk-head"><input class="in" id="pq" placeholder="Liste filtern: Nummer, Titel, Komponist" value="${esc(ui.pq)}" autocomplete="off"><div class="seg">${[['all','Alle'],['mix','Mixe'],['cue','Ansagen 9xx'],['used','Nicht im Auftritt']].map(([k,l])=>`<button data-pf="${k}" class="${ui.pf===k?'on':''}">${l}</button>`).join('')}</div></div><div class="pk-list" id="pklist"></div></div>`:''}`}

function rowView(it,i,r,clk,pos,g,set){
  const dur=(val,attr,calc,miss)=>`<input class="durin ${calc?'calc':''} ${miss?'miss':''}" ${attr} value="${val}" inputmode="decimal" aria-label="Dauer" title="${calc?'Dauer des ganzen Mixes (m:ss)':'Dauer m:ss'}">`;
  const acts=`<div class="acts">
    <button class="ib" data-a="up" title="nach oben">${ICON.up}</button><button class="ib" data-a="down" title="nach unten">${ICON.down}</button>
    ${it.kind==='song'?`<button class="ib" data-a="alt" title="Alternative zur Diskussion stellen">${ICON.alt}</button>`:''}
    ${it.kind!=='note'?`<button class="ib" data-a="mark" title="${MARKT[it.mark||'']}" style="color:${MARKC[it.mark||'']}">${ICON.dot}</button>`:''}
    ${it.kind!=='note'?`<button class="ib" data-a="nt" title="Ansage-Notiz">${ICON.note}</button>`:''}
    ${g.sets.length>1?`<select class="ib" data-a="mv" title="In anderes Set verschieben" style="width:34px;font-size:12px"><option value="">⇢</option>${g.sets.filter(s=>s.id!==set.id).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`:''}
    <button class="ib" data-a="del" title="entfernen">${ICON.del}</button></div>`;
  const noteFields=(show)=>show?`<div class="notein"><select class="in" data-f="sub">${['Ansage','Pause','Umbau','Regie','Sonstiges'].map(x=>`<option ${it.sub===x?'selected':''}>${x}</option>`).join('')}</select><input class="in" data-f="txt" value="${esc(it.txt)}" placeholder="Inhalt der Ansage / Notiz"><input class="in" data-f="who" list="band" value="${esc(it.who)}" placeholder="Wer?"></div>`:'';
  const base=`data-id="${it.id}"`;
  if(it.kind==='note'){
    return `<div class="row note" ${base}><button class="hd" title="Ziehen zum Verschieben">${ICON.grip}</button><span class="pos">–</span><span class="num" style="color:var(--ok);font-size:18px;">${esc(it.sub||'Ansage')}</span><div class="tt">${noteFields(true)}</div><span class="mx"></span>${dur(fmt(it.d),'data-f="d"')}<span class="clock">${clk}</span>${acts}</div>`}
  const markc=it.mark?'mk-'+it.mark:'';
  const noteLine=(it.txt||it.who||it.shownote)?`<div class="notein"><select class="in" data-f="sub">${['Ansage','Regie','Sonstiges'].map(x=>`<option ${it.sub===x?'selected':''}>${x}</option>`).join('')}</select><input class="in" data-f="txt" value="${esc(it.txt)}" placeholder="Ansage vorher / Hinweis"><input class="in" data-f="who" list="band" value="${esc(it.who)}" placeholder="Wer?"></div>`:'';
  if(it.kind==='free'){
    return `<div class="row ${markc}" ${base}><button class="hd" title="Ziehen zum Verschieben">${ICON.grip}</button><span class="pos">${pos}</span><span class="num ${it.n?'':'muted'}" style="${it.n?'':'font-size:16px'}" title="Nummer nicht im Repertoire">${it.n?esc(it.n):'frei'}</span><div class="tt"><div class="notein" style="grid-template-columns:1fr 1fr"><input class="in" data-f="t" value="${esc(it.t)}" placeholder="Titel"><input class="in" data-f="k" value="${esc(it.k)}" placeholder="Komponist"></div>${noteLine}</div><span class="mx"></span>${dur(fmt(it.d),'data-f="d"',false,it.d==null)}<span class="clock">${clk}</span>${acts}</div>`}
  const n=optN(it);const ks=kids[n]||[];const cue=isCue(n);
  const chips=it.opts.length>1?`<div class="chips">${it.opts.map((o,k)=>`<span class="chip ${k===(it.sel||0)?'on':''}"><button style="background:none;border:none;padding:0;color:inherit" data-a="pick" data-k="${k}"><b>${esc(o)}</b> ${esc(titleOf(o))} · ${fmt(itemDur(it,o).d)||'?'}</button>${k===(it.sel||0)?'':`<button class="x" data-a="split" data-k="${k}" title="Auch ins Set nehmen – als eigene Position direkt danach" style="width:auto;padding:0 6px;border-radius:99px;color:var(--ok);font-size:12px;font-weight:600">+ auch</button>`}<button class="x" data-a="unalt" data-k="${k}" title="Alternative entfernen">✕</button></span>`).join('')}<button class="btn s g" data-a="decide">✓ Nur ${esc(optN(it))} nehmen</button><button class="btn s" data-a="splitall" title="Alle Möglichkeiten nacheinander ins Set">Alle ${it.opts.length} spielen</button></div>`:'';
  const kOpen=(ui.kopen||{})[it.id];const exN=[].length;
  const mixBtn=ks.length?`<button class="mixb ${kOpen?'on':''}" data-kt="${it.id}" title="${ks.length} Teile ${kOpen?'ausblenden':'anzeigen'}">Mix${exN?' '+(ks.length-exN)+'/'+ks.length:''}</button>`:'';
  const kidRows=ks.length?`${kOpen?`<div class="kids">${ks.map(k=>{const off=[].includes(k);return `<div class="kid ${off?'off':''}" style="grid-template-columns:50px minmax(0,1fr)"><span class="kn">${esc(k)}</span><span>${esc(titleOf(k))}${compOf(k)?' <span class="muted">· '+esc(compOf(k))+'</span>':''}${off?' <span class="muted">(nicht gespielt)</span>':''}</span></div>`}).join('')}${exN?`<button class="btn s" data-a="kidsall" style="margin-top:4px;align-self:flex-start">Alle Teile spielen</button>`:''}</div>`:''}`:'';
  return `<div class="row ${cue?'cue':''} ${it.opts.length>1?'disc':''} ${markc}" ${base}${ks.length?' data-mix="1"':''}><button class="hd" title="Ziehen zum Verschieben">${ICON.grip}</button><span class="pos">${pos}</span><span class="num">${esc(n)}</span>
   <div class="tt"><div class="t">${esc(titleOf(n))}${!isCue(n)&&g.sets.reduce((a,s)=>a+s.items.filter(x=>x.kind==='song'&&optN(x)===n).length,0)>1?'<span class="tag" style="border-color:var(--red);color:#f0a09a">doppelt</span>':''}${it.opts.length>1?'<span class="tag">zur Diskussion</span>':''}${it.src?`<span class="tag" style="border-color:#3b5a38;color:var(--ok)">${esc(it.src)}</span>`:''}</div>${ks.length?kidRows:compOf(n)?`<div class="k">${esc(compOf(n))}</div>`:''}${chips}${noteLine}</div><span class="mx">${mixBtn}</span>
   ${dur(fmt(r.d),'data-sd="'+esc(n)+'"',ks.length>0,r.d==null)}<span class="clock">${clk}${r.est?'<br>~':''}</span>${acts}${it.opts.length>1?`<div class="vwrap">${voteBox(G(),it,!!(ui.vopen||{})[it.id])}</div>`:''}</div>`}

function rest(t,soll,big){if(!soll)return '';const d=soll-t;const c=d>=0?(d<60?'var(--ok)':'var(--gold2)'):'#f0a09a';const txt=d>=0?(d<60?'passt genau':'noch '+fmt(d)+' frei'):fmt(-d)+' zu lang';
  return big?`<div><div class="k">${d>=0?'Fehlt noch bis Soll':'Über dem Soll'}</div><div class="v" style="color:${c}">${d>=0&&d<60?'passt':fmt(Math.abs(d))}</div></div>`:`<span class="rest" style="color:${c};border-color:${c}">${txt}</span>`}
function durBar(st,soll,h){const base=Math.max(soll||0,st.t,1);const mu=Math.min(st.music,st.t)/base*100,an=Math.max(0,st.t-st.music)/base*100;
  return `<div class="sbar" style="height:${h||10}px"><i class="mu" style="width:${mu}%" title="Musik ${fmt(st.music)}"></i><i class="an" style="width:${an}%" title="Ansagen/Pausen ${fmt(st.t-st.music)}"></i>${soll?`<b style="left:${Math.min(100,soll/base*100)}%" title="Soll ${fmt(soll)}"></b>`:''}</div>`}
const tSec=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*3600+m*60};
const hm=x=>`${p2(Math.floor(x/3600)%24)}:${p2(Math.floor(x%3600/60))}`;
function timeCheck(g,all,tot){const a=tSec(g.from),b=tSec(g.to);if(a==null&&b==null)return '';
  if(a==null||b==null)return `<div class="tcheck">Auftritt ${g.from?'ab '+g.from:'bis '+g.to} Uhr</div>`;
  let win=b-a;if(win<=0)win+=86400;
  let msg='',c='var(--mut)';
  const starts=g.sets.map(s=>tSec(s.start));
  if(starts.every(x=>x!=null)&&starts.length){let s0=starts[0];if(s0<a-43200)s0+=86400;let last=starts[starts.length-1];if(last<a-43200)last+=86400;const end=last+all[all.length-1].t;
    const early=a-s0,late=end-(a+win);
    if(early>0){msg=`Block 1 beginnt ${fmt(early)} vor Auftrittsbeginn`;c='#f0a09a'}
    else if(late>0){msg=`Programm endet ${hm(end)}, ${fmt(late)} nach Auftrittsende`;c='#f0a09a'}
    else{msg=`passt · Programm ${hm(s0)}–${hm(end)}`;c='var(--ok)'}}
  else{const d=win-tot;if(d<0){msg=`Programm ${fmt(-d)} länger als das Zeitfenster`;c='#f0a09a'}else{msg=`passt · noch ${fmt(d)} Luft (inkl. Pausen zwischen den Blöcken)`;c='var(--ok)'}}
  return `<div class="tcheck">Auftritt ${g.from}–${g.to} Uhr (${Math.floor(win/3600)}:${p2(Math.floor(win%3600/60))} h) · <span style="color:${c}">${msg}</span></div>`}
function setTimes(set,st){if(!set.start)return null;const [h,m]=set.start.split(':').map(Number);const a=h*3600+m*60;const hm=x=>`${p2(Math.floor(x/3600)%24)}:${p2(Math.floor(x%3600/60))}`;return{from:set.start,to:hm(a+st.t),a,hm}}
function ovView(g,all){
  const tot=all.reduce((a,s)=>a+s.t,0),soll=g.sets.reduce((a,s)=>a+(s.soll||0)*60,0);
  const tbl=`<div class="scroll"><table class="ovt"><thead><tr><th>Block</th><th>Zeit</th><th class="r">Positionen</th><th class="r">Musik</th><th class="r">Ansagen</th><th class="r">Ist</th><th class="r">Soll</th><th class="r">Differenz</th><th>Hinweise</th></tr></thead><tbody>${g.sets.map((s,i)=>{const st=all[i];const tm=setTimes(s,st);const so=(s.soll||0)*60;const df=st.t-so;
    return `<tr><td><a data-set="${s.id}">${esc(s.name)}</a></td><td>${tm?tm.from+' – '+tm.to:'<span class="muted">–</span>'}</td><td class="r">${s.items.filter(x=>x.kind!=='note').length}</td><td class="r">${fmt(st.music)||'0:00'}</td><td class="r">${fmt(st.ansP)||'–'}</td><td class="r">${fmt(st.t)||'0:00'}</td><td class="r">${so?fmt(so):'–'}</td><td class="r" style="color:${so?(df>0?'#f0a09a':'var(--ok)'):'inherit'}">${so?(df>0?'+':'−')+fmt(Math.abs(df)):'–'}</td><td style="font-size:13px">${[st.disc?st.disc+'× Diskussion':'',st.miss?st.miss+'× ohne Dauer':'',st.est?'teils geschätzt':''].filter(Boolean).join(' · ')}</td></tr>`}).join('')}</tbody>
    <tfoot><tr><td>Gesamt</td><td>${(()=>{const f=setTimes(g.sets[0],all[0]);const l=setTimes(g.sets[g.sets.length-1],all[g.sets.length-1]);return f&&l?f.from+' – '+l.to:''})()}</td><td class="r">${g.sets.reduce((a,s)=>a+s.items.filter(x=>x.kind!=='note').length,0)}</td><td class="r">${fmt(all.reduce((a,s)=>a+s.music,0))||'0:00'}</td><td class="r">${fmt(all.reduce((a,s)=>a+s.ansP,0))||'–'}</td><td class="r">${fmt(tot)||'0:00'}</td><td class="r">${soll?fmt(soll):'–'}</td><td class="r">${soll?(tot>soll?'+':'−')+fmt(Math.abs(tot-soll)):'–'}</td><td></td></tr></tfoot></table></div>`;
  const cards=g.sets.map((s,i)=>{const st=all[i];const tm=setTimes(s,st);let clock=tm?tm.a:null;let pos=0;
    const lines=s.items.map(it=>{const r=itemDur(it);const c=clock!=null?tm.hm(clock):'';if(clock!=null&&r.d!=null)clock+=r.d;

function ovModel(g){const cols=[{h:'Pos.',w:5,right:true},{h:'#',w:8},{h:'Titel',w:52},{h:'Beginn',w:8,right:true},{h:'Dauer',w:8,right:true}];const rows=[];let tot=0;
  g.sets.forEach(s=>{const st=setStats(s);const tm=setTimes(s,st);tot+=st.t;let clock=tm?tm.a:null;let pos=0;
    rows.push({c:['','',`${s.name}${tm?'   '+tm.from+' – '+tm.to:''}${s.soll?'   (Soll '+fmt(s.soll*60)+')':''}`,'',fmt(st.t)],fill:'D9A232',bold:true});
    for(const it of s.items){const r=itemDur(it);const c=clock!=null?tm.hm(clock):'';if(clock!=null&&r.d!=null)clock+=r.d;
      if(it.kind==='note'){rows.push({c:['','',`${it.sub||'Ansage'}${it.txt?': '+it.txt:''}${it.who?' ('+it.who+')':''}`,c,fmt(r.d)],italic:true,color:'38761D'});continue}
      pos++;if(it.kind==='free'){rows.push({c:[String(pos),'',it.t,c,fmt(r.d)]});continue}
      const n=optN(it);const ks=kids[n]||[];rows.push({c:[String(pos),it.opts.join(' / '),titleOf(n)+(it.opts.length>1?' (noch offen)':'')+(ks.length?` – Mix ${ks.length-[].length}/${ks.length} Teile`:''),c,(r.est?'~':'')+fmt(r.d)],color:it.opts.length>1?'B45F06':null})}
    if(st.extra)rows.push({c:['','','Ansagen (Pauschale'+(st.said?', Rest':'')+')','',fmt(st.extra)],italic:true,color:'38761D'});
    rows.push({c:['','','Summe '+s.name,'',fmt(st.t)],bold:true,fill:'EDEDED'})});
  rows.push({c:['','','GESAMT alle Blöcke','',fmt(tot)],bold:true,fill:'BFBFBF'});
  return{kind:'ov',name:fileBase(g)+'_Gesamtuebersicht',title:(g.name||'Auftritt')+(g.date?' – '+g.date.split('-').reverse().join('.'):''),cols,rows,sheet:'Uebersicht'}}

/* ---------- Mix-Teile ---------- */
function parseParts(txt){return String(txt||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.split(/\s+[–-]\s+|\t|;/);return{t:(m[0]||'').trim(),k:(m.slice(1).join(' ')||'').trim()}})}
const partsText=n=>(kids[n]||[]).map(k=>byN[k].t+(byN[k].k?' – '+byN[k].k:'')).join('\n');
function setParts(n,parts){const old=new Set(kids[n]||[]);S.lib.items=S.lib.items.filter(i=>!old.has(i.n));
  parts.forEach((p,i)=>S.lib.items.push({n:n+String(i+1),t:p.t,k:p.k,own:true}));S.lib.items.sort((x,y)=>x.n.localeCompare(y.n));index()}
function libErr(m){ui.libErr=m;toast(m);render()}

/* ---------- Nummer ändern (überall) ---------- */
function renumber(o,nn){const map={[o]:nn};for(const k of kids[o]||[]){const nk=nn+k.slice(o.length);if(!byN[nk]||nk===k)map[k]=nk}
  for(const it of S.lib.items)if(map[it.n])it.n=map[it.n];
  S.lib.items.sort((x,y)=>x.n.localeCompare(y.n));
  for(const [a,b] of Object.entries(map)){if(S.info[a]&&Object.keys(S.info[a]).length){S.info[b]={...S.info[a]};S.info[a]={};saveInfo(a);saveInfo(b)}}
  const m=x=>map[x]||x;
  for(const g of Object.values(S.gigs)){let ch=false;for(const st of g.sets)for(const it of st.items)if(it.kind==='song'){const no=it.opts.map(m);if(JSON.stringify(no)!==JSON.stringify(it.opts)){it.opts=no;ch=true}}if(ch)saveGig(g.id)}
  for(const gb of Object.values(S.genres)){const ni=gb.items.map(m);if(ni.join()!==gb.items.join()){gb.items=ni;saveGenre(gb.id)}}
  index();saveLib()}

/* ---------- Abstimmung: Systemisches Konsensieren ---------- */
let VOTERS=[];const isOrg=()=>hasR('abstimmung');
const APPURL=()=>location.href.split('#')[0];
const vId=(gid,iid)=>`${gid}_${iid}_${ME_ID}`;
function tally(gid,it){const vs=Object.values(S.votes).filter(v=>v.g===gid&&v.i===it.id);
  const res=it.opts.map(o=>{const vals=vs.map(v=>v.v&&v.v[o]).filter(x=>typeof x==='number');const sum=vals.reduce((a,b)=>a+b,0);return{o,n:vals.length,sum,avg:vals.length?sum/vals.length:null}});
  const voted=[...new Set(vs.filter(v=>v.v&&Object.keys(v.v).length).map(v=>v.m))];
  const ranked=res.filter(r=>r.n).sort((a,b)=>a.avg-b.avg||a.sum-b.sum);return{res,voted,best:ranked[0]?ranked[0].o:null,vs}}
function myVote(gid,it,o){const v=S.votes[vId(gid,it.id)];return v&&v.v?v.v[o]:undefined}
const vcol=x=>`hsl(${Math.round(120-(x-1)*13)} 55% 42%)`;
function waText(g,it){return `🗳️ Abstimmung Brassmusix – ${g.name||'Auftritt'}${g.date?' ('+g.date.split('-').reverse().join('.')+')':''}\nWelches Stück nehmen wir? ${it.opts.map(o=>o+' '+titleOf(o)).join(' oder ')}\nBitte abstimmen (1 = finde ich toll, 10 = finde ich nicht gut): ${APPURL()}#vote-${g.id}`}
function voteStart(g,it){if(it.vote&&it.vote.open)return '';
  return isOrg()?`<div class="vsum"><button class="btn s g" data-a="vstart">Abstimmung starten</button><span>Die Band stimmt per Systemischem Konsensieren über diese Position ab.</span></div>`:`<div class="vsum"><span>Eine Abstimmung kann Christoph oder Michael starten.</span></div>`}
function voteBox(g,it,open){if(!(it.vote&&it.vote.open))return voteStart(g,it);const t=tally(g.id,it);const head=`${t.voted.length}/${VOTERS.length} abgestimmt${t.best?` · geringster Widerstand: <b style="color:var(--gold2)">${esc(t.best)} ${esc(titleOf(t.best))}</b>`:''}`;
  if(!open)return `<div class="vsum"><button class="btn s" data-a="vopen">Abstimmen</button><span>${head}</span></div>`;
  return `<div class="vote"><div class="vh"><b>Systemisches Konsensieren</b> · 1 = finde ich toll · 10 = finde ich nicht gut · ${head}</div>
   
   ${t.res.map(r=>{const mine=ME?myVote(g.id,it,r.o):undefined;const w=r.avg!=null?(r.avg/10*100):0;return `<div class="vrow ${t.best===r.o?'best':''}">
     <div class="vt"><span class="n">${esc(r.o)}</span> ${esc(titleOf(r.o))}${t.best===r.o?' <span class="tag">Favorit</span>':''}<span class="d">${fmt(itemDur(it,r.o).d)||'Dauer fehlt'}</span></div>
     <div class="vb">${Array.from({length:10},(_,i)=>i+1).map(x=>`<button data-vo="${esc(r.o)}" data-vv="${x}" ${!ME?'disabled':''} class="${mine===x?'on':''}" style="--c:${vcol(x)}" aria-label="Widerstand ${x}">${x}</button>`).join('')}</div>
     <div class="vr">${r.avg!=null?`Ø <b>${r.avg.toFixed(1)}</b> · Σ ${r.sum} · ${r.n} Stimme${r.n===1?'':'n'}`:'<span class="muted">noch keine Stimmen</span>'}<div class="vbar"><i style="width:${w}%;background:${r.avg!=null?vcol(Math.round(r.avg)):'transparent'}"></i></div></div></div>`}).join('')}
   <div class="helpbox" style="margin:2px 0 6px">Gestartet von ${esc(it.vote.by)} am ${new Date(it.vote.at).toLocaleDateString('de-DE')}.</div>

function search(q){q=q.trim().toLowerCase();if(!q)return[];
  const last=/[a-zäöüß]/i.test(q)?q:q.split(/[\s,;/]+/).pop();if(!last)return[];
  const res=[];for(const i of S.lib.items){const ch=parentOf[i.n]?4:0;
    const sc=i.n===last?0:i.n.startsWith(last)?1:i.t.toLowerCase().startsWith(last)?2:(i.t.toLowerCase().includes(last)||(i.k||'').toLowerCase().includes(last))?3:9;
    if(sc<9)res.push([sc+ch,i])}
  return res.sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n)).slice(0,14).map(x=>x[1])}
function drawDrop(){const d=$('#drop');if(!d)return;const r=search(ui.q);
  if(!r.length){d.classList.add('hide');return}

  d.classList.remove('hide')}

async function readXlsx(file){const z=await JSZip.loadAsync(file);const P=s=>new DOMParser().parseFromString(s,'application/xml');
  const ss=[];const sf=z.file('xl/sharedStrings.xml');if(sf){const d=P(await sf.async('string'));for(const si of d.getElementsByTagName('si')){ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))}}
  const wb=P(await z.file('xl/workbook.xml').async('string'));const sh=wb.getElementsByTagName('sheet')[0];
  const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  const rels=P(await z.file('xl/_rels/workbook.xml.rels').async('string'));let tgt='worksheets/sheet1.xml';
  for(const r of rels.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid)tgt=r.getAttribute('Target');
  const path=tgt.startsWith('/')?tgt.slice(1):'xl/'+tgt.replace(/^\.\//,'');
  const d=P(await z.file(path).async('string'));const cells={};
  for(const c of d.getElementsByTagName('c')){const ref=c.getAttribute('r');const t=c.getAttribute('t');let v='';
    if(t==='inlineStr'){v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('')}
    else{const ve=c.getElementsByTagName('v')[0];if(!ve)continue;v=ve.textContent;if(t==='s')v=ss[+v]??''}
    cells[ref]=v}
  const links={};const relp=path.replace(/worksheets\//,'worksheets/_rels/')+'.rels';const rf=z.file(relp);
  if(rf){const rd=P(await rf.async('string'));const map={};for(const r of rd.getElementsByTagName('Relationship'))map[r.getAttribute('Id')]=r.getAttribute('Target');
    for(const h of d.getElementsByTagName('hyperlink')){const id=h.getAttribute('r:id')||h.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');if(map[id])links[h.getAttribute('ref')]=map[id]}}
  const rows=[];const maxR=Math.max(0,...Object.keys(cells).map(k=>+k.replace(/\D/g,'')));
  for(let r=3;r<=maxR;r++){const n=normN(cells['B'+r]);if(!n||n==='#'||!/^\d+$/.test(n))continue;rows.push({n,t:String(cells['C'+r]||'').trim(),k:String(cells['D'+r]||'').trim(),yt:links['E'+r]||''})}
  return rows}
async function importXlsx(f,mode){
  if(typeof JSZip==='undefined'){toast('Excel-Funktion braucht Internet (JSZip konnte nicht geladen werden).');return}
  let rows;try{rows=await readXlsx(f)}catch(e){toast('Datei konnte nicht gelesen werden.');return}
  if(!rows.length){toast('Keine Nummern in Spalte B gefunden.');return}
  if(mode==='master'){const seen=new Set();const items=[];for(const r of rows){if(seen.has(r.n))continue;seen.add(r.n);const o={n:r.n,t:r.t,k:r.k};if(r.yt)o.yt=r.yt;items.push(o)}
    const old=S.lib.items.length;S.lib={items,file:f.name,at:new Date().toISOString(),rev:Math.max(S.lib.rev||0,99)};index();saveLib();
    toast(`${items.length} Einträge importiert${old?' (Liste ersetzt, Dauern bleiben erhalten)':''}`);render();return}
  const g=G();const nums=rows.map(r=>r.n);const set={id:uid(),name:(f.name.match(/(Block|Set)[ _]?\d+/i)||['Block '+(g.sets.length+1)])[0].replace('_',' '),start:'',soll:60,items:[]};

    else{cur=null;set.items.push({id:uid(),kind:'free',n:r.n,t:r.t||('Nr. '+r.n),k:r.k,d:null,mark:''})}}
  if(g.sets.length===1&&!g.sets[0].items.length)g.sets=[set];else g.sets.push(set);

  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`;

function toPdf(m){
  const W=m.landscape?842:595,H=m.landscape?595:842,ML=m.landscape?28:18,MT=36,MB=36;const fs=m.kind==='gema'?7.5:10,rh=fs*1.6,pad=3;

/* ---------- Export-Steuerung ---------- */
async function build(m,fmtk){if(fmtk==='pdf')return toPdf(m);if(typeof JSZip==='undefined')throw new Error('nojszip');return fmtk==='xlsx'?toXlsx(m):toDocx(m)}
async function doExport(k){const g=G();if(!g)return;const [what,f]=k.split('-');
  try{
    if(what==='set'){const m=setModel(g,SET());return saveFile(m.name+'.'+f,await build(m,f))}
    if(what==='ov'){const m=ovModel(g);return saveFile(m.name+'.'+f,await build(m,f))}
    if(what==='gema'){const m=gemaModel(g);return saveFile(m.name+'.'+f,await build(m,f))}
    if(what==='all'){if(typeof JSZip==='undefined')throw new Error('nojszip');const z=new JSZip();
      for(const s of g.sets){const m=setModel(g,s);z.file(m.name+'.'+f,await build(m,f))}
      return saveFile(fileBase(g)+'_Setlisten_'+f.toUpperCase()+'.zip',await z.generateAsync({type:'uint8array'}))}
  }catch(e){toast(e.message==='nojszip'?'Für Excel/Word wird eine Internetverbindung gebraucht.':'Export fehlgeschlagen.');console.error(e)}}
let dlCap=null;
async function saveFile(name,data){
  if(window.claude&&claude.use){if(dlCap===null){try{dlCap=await claude.use('downloads')||false}catch(e){dlCap=false}}
    if(dlCap){try{await dlCap.save({filename:name,data});toast('Gespeichert: '+name)}catch(e){if(e&&e.code!=='declined')toast('Speichern nicht möglich ('+(e.code||'Fehler')+')')}return}}
  const url=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Gespeichert: '+name)}

function firstRender(){fromHash();pickDefault();render()}
function fromHash(){const h=location.hash||'';const m=h.match(/^#(g|vote)-(.+)$/);if(m&&S.gigs[m[2]]){ui.mhome=false;ui.gig=m[2];ui.set=null;ui.view='gig';ui.vt=m[1]==='vote';ui.ov=false}}
window.addEventListener('hashchange',()=>{fromHash();render()});
function pickDefault(){const ids=Object.keys(S.gigs);if(!ui.gig&&ids.length){const today=new Date().toISOString().slice(0,10);const up=Object.values(S.gigs).filter(g=>!g.date||g.date>=today).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));ui.gig=(up[0]||S.gigs[ids[0]]).id}}
window.__bmx={S:()=>S,ui,setModel,gemaModel,toXlsx,toDocx,toPdf,index,render,store,docs:()=>GIGDOCS,termine:()=>TERMINE};
initStore();
