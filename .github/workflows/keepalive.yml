# Hält das kostenlose Supabase-Projekt wach (Supabase pausiert nach 7 Tagen ohne Nutzung).
name: Supabase wach halten

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY fehlen"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o antwort.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Versuch $i: HTTP $code – $(cat antwort.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "Supabase antwortet nicht – im Supabase-Dashboard „Restore project“ klicken."
          exit 1

      - name: Workflow aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
