header .logo{display:block}
header .logo{white-space:nowrap;font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:1px;color:var(--text);font-size:24px;line-height:1}
header .logo b{color:var(--gold);font-weight:400}
h1,.monat,.datebox .d{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.5px}
h1{font-size:30px}
header .me{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
header .me button{margin-left:6px}
main{max-width:760px;margin:0 auto;padding:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs a{flex:1;text-align:center;padding:10px 4px 8px;color:var(--muted);text-decoration:none;font-size:12px}
nav.tabs a span{display:block;font-size:20px;line-height:1.1}
nav.tabs a.on{color:var(--accent)}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:20px 0 8px;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.datebox{width:52px;text-align:center;background:var(--card2);border-radius:8px;padding:6px 0;flex:none}
.datebox .d{font-size:26px;line-height:1;color:var(--gold)}
.datebox .m{font-size:11px;color:var(--muted);text-transform:uppercase}
.datebox .y{font-size:11px;color:var(--gold);font-weight:700}
.monat{font-size:28px;color:var(--gold);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.title{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.b-probe{color:var(--muted);border-color:var(--line2)}
.b-anfrage{color:var(--accent-hell);border-color:#8A5410}
.b-auftritt{color:#121212;background:var(--gold);border-color:var(--gold)}
.b-abgesagt{color:var(--bad);border-color:#6b2a22}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2)}

function beispielVergangenheit(data) {
  const d0 = today();
  const mk = (art, titel, datum, von, bis, ort) => { const t = { id: uid(), art, titel, datum, von, bis, ort, beschreibung: "", pa: art !== "probe", eigener_mischer: false, frist: "", status: "aktiv" }; data.termine.push(t); return t; };
  const muster = { m1: "zzzz", m2: "zzaz", m3: "azza", m4: "zzzz", m5: "zazz", m6: "zzza", m7: "azzz" };
  const da = { m1: "1111", m2: "1101", m3: "0110", m4: "1111", m5: "1011", m6: "1110", m7: "0111" };
  [28, 21, 14, 7].forEach((tage, i) => {
    const t = mk("probe", "Probe (Beispiel)", addDays(d0, -tage), "19:30", "21:30", "Proberaum");
    Object.entries(muster).forEach(([mid, mu]) => {
      data.rueckmeldungen.push({ termin_id: t.id, mitglied_id: mid, status: mu[i] === "z" ? "zu" : "ab", kommentar: "", updated_at: new Date(Date.parse(addDays(t.datum, -3) + "T18:00:00")).toISOString() });
      if (i < 3) data.anwesenheiten.push({ termin_id: t.id, mitglied_id: mid, anwesend: da[mid][i] === "1", updated_at: new Date(Date.parse(t.datum + "T21:45:00")).toISOString(), eingetragen_von: "m2" });
    });
  });
  [40, 19].forEach(tage => {
    const t = mk("auftritt", "Auftritt (Beispiel)", addDays(d0, -tage), "17:00", "20:00", "");
    data.mitglieder.forEach(m => { if (m.id !== "m8") data.rueckmeldungen.push({ termin_id: t.id, mitglied_id: m.id, status: "zu", kommentar: "", updated_at: new Date(Date.parse(addDays(t.datum, -10) + "T12:00:00")).toISOString() }); });
  });
}

/* ---------- Datenspeicher: Demo ---------- */
function DemoStore() {
  const KEY = "bmx-demo-v1";
  let data;
  try { data = JSON.parse(lsGet(KEY)) || null; } catch { data = null; }
  if (!data) data = seed();
  data.einladungen ||= [];
  data.anwesenheiten ||= [];
  data.mitglieder.forEach(m => { if (m.rollen.includes("statistik")) m.rollen = [...m.rollen.filter(r => r !== "statistik"), "uebersicht", "anwesenheit"]; });
  if (!data.beispielVergangenheit) { beispielVergangenheit(data); data.beispielVergangenheit = true; }
  // ältere Demo-Daten im Browser: Mischer hieß dort noch „Mischer (Name eintragen)“
  data.mitglieder.forEach(m => { if (/^Mischer( \(Name eintragen\))?$/.test(m.name)) m.name = "Wiggi"; });
  data.aushilfen.forEach(a => { a.name = a.name.replace(/^Mischer( \(Name eintragen\))? –/, "Mischer –"); });
  const listeners = [];
  const save = () => { lsSet(KEY, JSON.stringify(data)); listeners.forEach(f => f()); };
  return {
    mode: "demo",
    get data() { return data; },
    async init() { },
    onChange(f) { listeners.push(f); },
    async currentMember() { const id = lsGet("bmx-demo-me"); return data.mitglieder.find(m => m.id === id) || null; },
    async loginAs(id) { lsSet("bmx-demo-me", id); },
    async logout() { lsDel("bmx-demo-me"); },
    async einladungErstellen(mid) {
      const code = neuerCode(), gueltig_bis = new Date(Date.now() + 14 * 864e5).toISOString();
      data.einladungen = data.einladungen.filter(e => !(e.mitglied_id === mid && !e.eingeloest_am));
      data.einladungen.push({ id: uid(), mitglied_id: mid, code_hash: codeNorm(code), erstellt_am: new Date().toISOString(), gueltig_bis, eingeloest_am: null });
      save(); return { code, gueltig_bis };
    },
    async einladungEinloesen(code) {
      const e = data.einladungen.find(x => x.code_hash === codeNorm(code) && !x.eingeloest_am && x.gueltig_bis > new Date().toISOString());
      if (!e) throw new Error("Code ungültig, abgelaufen oder schon benutzt.");
      e.eingeloest_am = new Date().toISOString();
      const m = data.mitglieder.find(x => x.id === e.mitglied_id); if (m) m.angemeldet = true;
      lsSet("bmx-demo-me", e.mitglied_id); save();
    },
    async upsertMany(table, rows) { for (const r of rows) await this.upsert(table, r, true); save(); },
    async removeAnwesenheit(tid, mid) { data.anwesenheiten = data.anwesenheiten.filter(r => !(r.termin_id === tid && r.mitglied_id === mid)); save(); },
    async upsert(table, row, ohneSpeichern) {
      const arr = data[table];
      const i = (table === "rueckmeldungen" || table === "anwesenheiten")
        ? arr.findIndex(x => x.termin_id === row.termin_id && x.mitglied_id === row.mitglied_id)
        : arr.findIndex(x => x.id === row.id);
      if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push({ ...row });
      if (!ohneSpeichern) save();
    },
    async removeRueckmeldungen(tid) { data.rueckmeldungen = data.rueckmeldungen.filter(r => r.termin_id !== tid); save(); },
    async removeRueckmeldung(tid, mid) { data.rueckmeldungen = data.rueckmeldungen.filter(r => !(r.termin_id === tid && r.mitglied_id === mid)); save(); },
    async remove(table, id) { data[table] = data[table].filter(x => x.id !== id); if (table === "termine") { data.rueckmeldungen = data.rueckmeldungen.filter(r => r.termin_id !== id); data.anfragen = data.anfragen.filter(a => a.termin_id !== id); } save(); },
    async anfrageLesen(token) {
      const a = data.anfragen.find(x => x.token === token); if (!a) return null;
      const t = data.termine.find(x => x.id === a.termin_id) || {};
      return { status: a.status, register: a.register, name: a.aushilfe_name, titel: t.titel, art: t.art, datum: t.datum, von: t.von, bis: t.bis, ort: t.ort, termin_status: t.status };
    },
    async anfrageAntworten(token, zusage) {
      const a = data.anfragen.find(x => x.token === token); const tt = a && data.termine.find(x => x.id === a.termin_id);
      if (!a || a.status === "zurueckgezogen" || !tt || tt.status === "abgesagt" || tt.datum < today()) return this.anfrageLesen(token);
      a.status = zusage ? "zu" : "ab"; a.beantwortet_am = new Date().toISOString(); save();
      return this.anfrageLesen(token);
    },
    async notify(ids, titel, text) {
      const namen = ids.map(id => data.mitglieder.find(m => m.id === id)?.name).filter(Boolean);
      toast(`<b>Push (Demo):</b> „${esc(titel)}“ an ${esc(namen.join(", ") || "niemand")}`, 4500);
      return namen.length;
    },
    reset() { data = seed(); save(); },
    exportJson() { return JSON.stringify(data, null, 2); },
    importJson(txt) { data = JSON.parse(txt); save(); },
  };
}

/* ---------- Datenspeicher: Live (Supabase) ---------- */
async function LiveStore() {
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  const sb = createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const data = { mitglieder: [], aushilfen: [], termine: [], rueckmeldungen: [], anfragen: [], einstellungen: [], einladungen: [], anwesenheiten: [] };
  const listeners = [];
  const TABLES = Object.keys(data);
  let timer;
  async function load() {
    const res = await Promise.all(TABLES.map(t => sb.from(t).select("*")));
    res.forEach((r, i) => { if (!r.error) data[TABLES[i]] = r.data || []; });
    data.mitglieder.forEach(m => { m.register ||= []; m.rollen ||= []; });
    data.termine.forEach(t => { t.von ||= ""; t.bis ||= ""; t.frist ||= ""; t.frist_uhrzeit ||= ""; });
    listeners.forEach(f => f());
  }
  const reloadSoon = () => { clearTimeout(timer); timer = setTimeout(load, 250); };
  return {
    mode: "live", sb,
    get data() { return data; },
    async init() {
      const { data: s } = await sb.auth.getSession();
      if (s.session) {
        await load();
        const ch = sb.channel("alles");
        TABLES.forEach(t => ch.on("postgres_changes", { event: "*", schema: "public", table: t }, reloadSoon));
        ch.subscribe();
        document.addEventListener("visibilitychange", () => { if (!document.hidden) reloadSoon(); });
      }
    },
    onChange(f) { listeners.push(f); },
    async currentMember() {
      const { data: s } = await sb.auth.getSession();
      const u = s.session?.user; if (!u) return null;
      const email = (u.email || "").toLowerCase();
      return data.mitglieder.find(m => m.auth_id === u.id) || data.mitglieder.find(m => m.email && m.email.toLowerCase() === email) || { id: null, name: email, email, register: [], rollen: [], unbekannt: true };
    },
    async sendCode(email) { const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: APP_URL } }); if (error) throw error; },
    async verifyCode(email, token) { const { error } = await sb.auth.verifyOtp({ email, token, type: "email" }); if (error) throw error; await this.init(); },
    async logout() { await sb.auth.signOut(); },
    async einladungErstellen(mid) {
      const { data: d, error } = await sb.functions.invoke("einladung", { body: { aktion: "erstellen", mitglied_id: mid } });
      if (error || d?.error) throw new Error(d?.error || error.message);
      await load(); return d;
    },
    async einladungEinloesen(code) {
      const { data: d, error } = await sb.functions.invoke("einladung", { body: { aktion: "einloesen", code } });
      if (error || d?.error) throw new Error(d?.error || "Code ungültig, abgelaufen oder schon benutzt.");
      const { error: e2 } = await sb.auth.verifyOtp({ token_hash: d.token_hash, type: "magiclink" });
      if (e2) throw e2;
      await this.init();
    },
    async upsert(table, row) {
      const opts = (table === "rueckmeldungen" || table === "anwesenheiten") ? { onConflict: "termin_id,mitglied_id" } : {};
      const { error } = await sb.from(table).upsert(row, opts);
      if (error) { toast("Fehler: " + esc(error.message)); throw error; }
      await load();
    },
    async upsertMany(table, rows) { if (!rows.length) return; const { error } = await sb.from(table).upsert(rows, { onConflict: "termin_id,mitglied_id" }); if (error) { toast("Fehler: " + esc(error.message)); throw error; } await load(); },
    async removeAnwesenheit(tid, mid) { const { error } = await sb.from("anwesenheiten").delete().eq("termin_id", tid).eq("mitglied_id", mid); if (error) { toast("Fehler: " + esc(error.message)); throw error; } await load(); },
    async removeRueckmeldung(tid, mid) { const { error } = await sb.from("rueckmeldungen").delete().eq("termin_id", tid).eq("mitglied_id", mid); if (error) { toast("Fehler: " + esc(error.message)); throw error; } await load(); },
    async removeRueckmeldungen(tid) { const { error } = await sb.from("rueckmeldungen").delete().eq("termin_id", tid); if (error) { toast("Fehler: " + esc(error.message)); throw error; } await load(); },
    async remove(table, id) { const { error } = await sb.from(table).delete().eq("id", id); if (error) { toast("Fehler: " + esc(error.message)); throw error; } await load(); },
    async meinIcalToken(neu = false) { const { data: d, error } = await sb.rpc("mein_ical_token", { p_neu: neu }); if (error) throw error; return d; },
    async anfrageLesen(token) { const { data: d, error } = await sb.rpc("anfrage_lesen", { p_token: token }); if (error) throw error; return d; },
    async anfrageAntworten(token, zusage) { const { data: d, error } = await sb.rpc("anfrage_antworten", { p_token: token, p_zusage: zusage }); if (error) throw error; return d; },
    async notify(ids, titel, text, url) {
      if (!ids.length) return 0;
      const { data: d, error } = await sb.functions.invoke("notify", { body: { mitglied_ids: ids, titel, text, url } });
      if (error) { toast("Push fehlgeschlagen: " + esc(error.message)); return 0; }
      toast(`Push an ${d?.gesendet ?? 0} Gerät(e) gesendet`);
      return d?.gesendet ?? 0;
    },
    async pushAbonnieren(me) {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("Dieses Gerät/Browser unterstützt keine Push-Nachrichten. iPhone: App zuerst über Safari → Teilen → „Zum Home-Bildschirm“ installieren und von dort öffnen.");
      if (!CFG.vapidPublicKey) throw new Error("vapidPublicKey fehlt in der Konfiguration.");
      const perm = await Notification.requestPermission();
      if (perm !== "granted") throw new Error("Benachrichtigungen wurden nicht erlaubt.");
      const reg = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(CFG.vapidPublicKey.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(CFG.vapidPublicKey.length / 4) * 4, "=")), c => c.charCodeAt(0));
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      const j = sub.toJSON();
      const { error } = await sb.from("push_abos").upsert({ mitglied_id: me.id, endpoint: j.endpoint, abo: j }, { onConflict: "endpoint" });
      if (error) throw error;
    },
  };
}

/* ---------- Logik ---------- */
let S, me = null;
const D = () => S.data;
const has = r => !!me && (me.rollen.includes(r) || me.rollen.includes("admin"));
const canEdit = t => has("auftritte") || (t.art === "probe" && has("proben"));
const canCreate = art => art === "probe" ? (has("proben") || has("auftritte")) : art === "auftritt" ? has("zusage") : has("auftritte");
const vorbei = t => t.datum < today();
const sehenStat = () => has("uebersicht") || has("proben") || has("auftritte");
const sehenAnw = () => has("anwesenheit") || has("proben") || has("auftritte");
const antwortMoeglich = t => t.status !== "abgesagt" && !vorbei(t);

function eingeladen(t) {
  return D().mitglieder.filter(m => {
    const nurMischer = m.register.length === 1 && m.register[0] === "mischer";
    return !nurMischer || t.eigener_mischer;
  });
}
const antwort = (t, mid) => D().rueckmeldungen.find(r => r.termin_id === t.id && r.mitglied_id === mid);
const anfragenVon = (t, reg) => D().anfragen.filter(a => a.termin_id === t.id && (!reg || a.register === reg));

function besetzung(t) {
  const inv = eingeladen(t);
  const rows = [];
  for (const r of REGISTER) {
    if (r.id === "mischer" && !t.eigener_mischer) continue;
    const mem = inv.filter(m => m.register.includes(r.id));
    const need = t.art === "probe" ? r.probeMin : mem.length;
    const zu = mem.filter(m => antwort(t, m.id)?.status === "zu");
    const ab = mem.filter(m => antwort(t, m.id)?.status === "ab");
    const offen = mem.filter(m => !antwort(t, m.id));
    const aus = anfragenVon(t, r.id).filter(a => a.status !== "zurueckgezogen");
    const ausZu = aus.filter(a => a.status === "zu");
    const have = zu.length + ausZu.length;
    const missing = Math.max(0, need - have);
    const state = missing === 0 ? "ok" : missing <= offen.length ? "offen" : "luecke";
    if (!mem.length && !aus.length && need === 0) continue;
    const ueber = need > 0 && have > need && ausZu.length > 0; // nur relevant, wenn Aushilfen „zu viel“ zugesagt haben
    rows.push({ reg: r, mem, need, zu, ab, offen, aus, have, missing, state, ueber, optional: need === 0 });
  }
  const st = rows.some(x => x.state === "luecke") ? "luecke" : rows.some(x => x.state === "offen") ? "offen" : "ok";
  return { rows, st };
}
const stLabel = { ok: "Besetzung vollständig", offen: "Rückmeldungen offen", luecke: "Lücke – Aushilfe nötig" };

const app = () => $("#app");
let filter = lsGet("bmx-filter") || "kommend";
const istNurMischer = m => !!m && m.register?.length === 1 && m.register[0] === "mischer";
const nurMeine = () => istNurMischer(me) && lsGet("bmx-nurmeine") !== "0";

function renderHeader() {
  $("#me").innerHTML = me ? `${esc(me.name)}<br><span>${S.mode === "demo" ? "Demo" : ""}</span> <button class="mini" id="logout">Abmelden</button>` : "";
  $("#logout")?.addEventListener("click", async () => { await S.logout(); me = null; location.hash = "#/"; route(); });
  const tabs = [["#/", "📅", "Termine"]];
  if (me) {
    if (sehenStat()) tabs.push(["#/auswertung", "📊", "Übersicht"]);
    if (sehenAnw()) tabs.push(["#/anwesenheit", "✅", "Anwesenheit"]);
    tabs.push(["#/verwaltung", "⚙️", has("mitglieder") ? "Verwaltung" : "Mehr"]);
  }

}

function badge(t) {
  if (t.status === "abgesagt") return `<span class="badge b-abgesagt">abgesagt</span>`;
  return `<span class="badge b-${t.art}">${ART[t.art]}</span>`;
}

function antwortButtons(t, compact) {
  if (!me?.id || t.status === "abgesagt" || !eingeladen(t).some(m => m.id === me.id)) return "";
  if (vorbei(t)) { const a = antwort(t, me.id)?.status; return `<span class="small muted">Termin vorbei${a ? ` – du hattest ${a === "zu" ? "zugesagt" : "abgesagt"}` : ""}</span>`; }
  const a = antwort(t, me.id)?.status;
  const cls = compact ? "mini" : "";
  const k = antwort(t, me.id)?.kommentar;
  return `<div class="row" style="gap:6px"><button class="zu ${cls} ${a === "zu" ? "on" : ""}" data-antwort="zu" data-t="${t.id}">✓ Ich kann</button><button class="ab ${cls} ${a === "ab" ? "on" : ""}" data-antwort="ab" data-t="${t.id}">✗ Ich kann nicht</button></div>
    <button class="bemerkung-link" data-bemerkung="${t.id}">${k ? `💬 „${esc(k)}“ <u>ändern</u>` : "💬 Bemerkung hinzufügen"}</button>`;
}

function installBanner() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if (S.mode === "demo") return `<div class="banner demo"><b>Demo-Modus:</b> Daten liegen nur in diesem Browser. Oben rechts abmelden, um eine andere Person zu spielen.</div>`;

  return "";
}

function viewListe() {
  const d0 = today();
  let list = [...D().termine];
  const f = {
    kommend: t => t.datum >= d0,
    probe: t => t.art === "probe" && t.datum >= d0,
    anfrage: t => t.art === "anfrage" && t.datum >= d0,
    auftritt: t => t.art === "auftritt" && t.datum >= d0,
    offen: t => t.datum >= d0 && t.status !== "abgesagt" && me?.id && eingeladen(t).some(m => m.id === me.id) && !antwort(t, me.id),
    vergangen: t => t.datum < d0,
  }[filter] || (() => true);
  const meins = t => me?.id && eingeladen(t).some(m => m.id === me.id);
  if (nurMeine()) list = list.filter(meins);
  list = list.filter(f).sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von));
  if (filter === "vergangen") list.reverse();
  const offenZahl = D().termine.filter(t => t.datum >= d0 && t.status !== "abgesagt" && me?.id && eingeladen(t).some(m => m.id === me.id) && !antwort(t, me.id)).length;
  const fb = (k, l) => `<button data-filter="${k}" class="${filter === k ? "on" : ""}">${l}</button>`;
  app().innerHTML = `
    ${installBanner()}
    <h1>Termine</h1>
    <div class="filters">${fb("kommend", "Alle kommenden")}${fb("offen", `Meine offenen (${offenZahl})`)}${fb("probe", "Proben")}${fb("anfrage", "Anfragen")}${fb("auftritt", "Auftritte")}${fb("vergangen", "Vergangene")}</div>
    ${istNurMischer(me) ? `<label class="check nurmeine"><input type="checkbox" id="nurmeine" ${nurMeine() ? "checked" : ""}>🎛️ Nur Termine, bei denen ich als Mischer dabei bin</label>` : ""}
    ${list.length ? list.map((t, i) => {
      const b = besetzung(t);
      const mon = t.datum.slice(0, 4);
      const vorher = i ? list[i - 1].datum.slice(0, 4) : "";
      const ichOffen = me?.id && antwortMoeglich(t) && eingeladen(t).some(m => m.id === me.id) && !antwort(t, me.id);
      return `${mon !== vorher ? `<div class="monat">${mon}</div>` : ""}<div class="card${ichOffen ? " ich-offen" : ""}">${ichOffen ? `<div class="offen-tag">Deine Rückmeldung fehlt noch</div>` : ""}
        <div class="row">
          <div class="datebox"><div class="d">${fmtDay(t.datum)}</div><div class="m">${fmtMon(t.datum)}</div></div>
          <a class="grow" href="#/t/${t.id}" style="color:inherit;text-decoration:none">
            <div class="title">${esc(t.titel || ART[t.art])}</div>
            <div class="muted">${badge(t)} ${esc(zeit(t))}${t.ort ? " · " + esc(t.ort) : ""}</div>
            ${t.status !== "abgesagt" ? `<div class="small"><span class="pill p-${b.st}">${stLabel[b.st]}</span>${t.frist && !fristVorbei(t) ? ` <span class="muted">Rückmeldung bis ${fristText(t)}</span>` : ""}</div>` : ""}
          </a>
        </div>
        <div class="liste-antwort">${antwortButtons(t, true)}</div>
      </div>`;
    }).join("") : `<p class="muted">Keine Termine in dieser Ansicht.</p>`}
    <div class="actions"><button id="ics" class="mini">📆 Termine als Kalenderdatei (.ics)</button></div>`;
  $("#hideinst")?.addEventListener("click", e => { e.preventDefault(); lsSet("bmx-hide-install", "1"); route(); });
  $("#ics").addEventListener("click", icsDownload);
  $("#nurmeine")?.addEventListener("change", e => { lsSet("bmx-nurmeine", e.target.checked ? "1" : "0"); viewListe(); });
}

function chipM(t, m) {
  const a = antwort(t, m.id);
  const st = a?.status || "offen";
  const kom = a?.kommentar ? ` title="${esc(a.kommentar)}"` : "";
  return `<span class="chip ${st}"${kom}>${esc(m.name)}${a?.kommentar ? " 💬" : ""}</span>`;
}

function waLink(aus, a, t) {
  const tel = (aus.telefon || "").replace(/[^\d+]/g, "").replace(/^\+/, "").replace(/^00/, "").replace(/^0/, "49");
  const link = `${APP_URL.split("#")[0]}#/antwort/${a.token}`;
  const text = `Hallo ${aus.name.trim()},\nhast du am ${fmtDate(t.datum)} (${zeit(t)}) Zeit für „${t.titel || ART[t.art]}“${t.ort ? " in " + t.ort : ""}?\nHier kurz zu- oder absagen: ${link}\nBei Rückfragen bitte melden.`;
  return { url: `https://wa.me/${tel}?text=${encodeURIComponent(text)}`, link, ohneNummer: !tel };
}

function kette(t, row) {
  const alle = D().aushilfen.filter(x => x.register === row.reg.id && x.aktiv).sort((a, b) => a.rang - b.rang);
  if (!alle.length) return `<div class="chain small muted">Keine Aushilfen für ${esc(row.reg.name)} eingetragen. ${has("admin") ? `<a href="#/verwaltung">Jetzt eintragen</a>` : ""}</div>`;
  return `<div class="chain"><div class="small muted" style="margin-bottom:4px">Aushilfen-Kette ${esc(row.reg.name)} – du entscheidest, wann du die nächste fragst</div>${alle.map(aus => {
    const a = D().anfragen.find(x => x.termin_id === t.id && x.aushilfe_id === aus.id && x.status !== "zurueckgezogen");
    let st = `<span class="muted small">noch nicht gefragt</span>`;
    const neuTok = uid();
    const vorschau = waLink(aus, { token: neuTok, register: row.reg.id }, t);
    let btn = `<a class="btn mini primary" href="${esc(vorschau.url)}" target="_blank" rel="noopener" data-anfragen="${aus.id}" data-reg="${row.reg.id}" data-token="${neuTok}">WhatsApp-Anfrage</a>`;
    if (a) {
      st = a.status === "offen" ? `<span class="small" style="color:var(--warn)">angefragt ${seitText(a.gesendet_am)}</span>`
        : a.status === "zu" ? `<span class="small" style="color:var(--ok)">✓ hat zugesagt</span>` : `<span class="small" style="color:var(--bad)">✗ hat abgesagt</span>`;
      btn = `<a class="btn mini" href="${esc(waLink(aus, a, t).url)}" target="_blank" rel="noopener">Nochmal senden</a><button class="mini" data-copy="${a.id}">Link kopieren</button>${S.mode === "demo" ? `<a class="btn mini" href="#/antwort/${a.token}">Antwortseite testen</a>` : ""}</div>${a.status === "offen" ? `<div class="btns small muted" style="align-items:center">Antwortet über den Link automatisch. Nur falls sie sich direkt meldet: <button class="mini" data-manuell="zu" data-a="${a.id}">Zusage eintragen</button><button class="mini" data-manuell="ab" data-a="${a.id}">Absage eintragen</button>` : `<div class="btns">`}<button class="mini danger" data-zurueck="${a.id}">Zurückziehen</button>`;
    }
    return `<div class="item"><span class="rank">${aus.rang}</span><div class="grow"><b>${esc(aus.name)}</b><div>${st}</div></div><div class="btns">${btn}</div></div>`;
  }).join("")}</div>`;
}

// Organisatoren (Auftritte) bzw. Proben-Verantwortliche dürfen den Status aller ändern – auch nachträglich
const darfFuerAndere = t => !!me?.id && canEdit(t) && t.status !== "abgesagt";
async function setzeAntwort(tid, mid, status) {
  const t = D().termine.find(x => x.id === tid); if (!t || !darfFuerAndere(t)) { toast("Dafür fehlt dir das Recht."); return; }
  const alt = antwort(t, mid);
  if (!status) { if (alt) await S.removeRueckmeldung(tid, mid); }
  else await S.upsert("rueckmeldungen", { termin_id: tid, mitglied_id: mid, status, kommentar: alt?.kommentar || "", updated_at: new Date().toISOString(), eingetragen_von: mid === me.id ? null : me.id });
  const m = D().mitglieder.find(x => x.id === mid);
  toast(`${esc(m?.name || "")}: ${status === "zu" ? "kann" : status === "ab" ? "keine Zeit" : "Antwort zurückgesetzt"} ✓`);
}
function statusDialog(tid, mid) {
  const t = D().termine.find(x => x.id === tid), m = D().mitglieder.find(x => x.id === mid), a = antwort(t, mid);
  const o = dialog(`<h1 style="margin-top:0;font-size:24px">${esc(m.name)}</h1>
    <p class="muted small">${esc(t.titel || ART[t.art])} · ${fmtDate(t.datum)}${a ? `<br>Aktuell: <b>${a.status === "zu" ? "kann" : "keine Zeit"}</b> <em>(${zeitpunkt(a.updated_at)}${a.eingetragen_von ? `, eingetragen von ${esc(D().mitglieder.find(x => x.id === a.eingetragen_von)?.name || "Organisation")}` : ""})</em>` : "<br>Noch keine Antwort"}</p>
    <div class="actions"><button class="zu ${a?.status === "zu" ? "on" : ""}" data-s="zu">✓ Kann</button><button class="ab ${a?.status === "ab" ? "on" : ""}" data-s="ab">✗ Keine Zeit</button>${a ? `<button data-s="">Antwort zurücksetzen</button>` : ""}</div>
    <p class="hint">Du trägst das stellvertretend ein – z. B. wenn jemand per Telefon oder WhatsApp Bescheid gegeben hat.</p>`);
  o.querySelectorAll("[data-s]").forEach(b => b.onclick = async () => { o.remove(); await setzeAntwort(tid, mid, b.dataset.s || null); });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-statusdlg]"); if (b) { e.preventDefault(); const [tid, mid] = b.dataset.statusdlg.split("|"); statusDialog(tid, mid); } });

// Rückmeldefrist mit optionaler Uhrzeit (bei Anfragen automatisch 48 Stunden ab Anlegen)
const fristText = t => t.frist ? `${fmtDate(t.frist)}${t.frist_uhrzeit ? `, ${t.frist_uhrzeit} Uhr` : ""}` : "";
const fristTs = t => t.frist ? Date.parse(`${t.frist}T${t.frist_uhrzeit || "23:59"}:00`) : null;
const fristVorbei = t => t.frist && Date.now() > fristTs(t);
function plus48() { const d = new Date(Date.now() + 48 * 3600e3); const z = n => String(n).padStart(2, "0"); return { datum: `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`, zeit: `${z(d.getHours())}:${z(d.getMinutes())}` }; }

// Einen einzelnen Termin in der WhatsApp-Gruppe teilen – Musiker stimmen per Link in der App ab
function teilenText(t) {
  const link = `${APP_URL.split("#")[0]}#/t/${t.id}`;
  const art = t.art === "anfrage" ? "Neue Auftrittsanfrage" : t.art === "auftritt" ? "Auftritt" : "Probe";
  const ton = t.art !== "probe" ? `\n🔊 ${t.pa ? "mit PA" : "ohne PA"}${t.eigener_mischer ? ", Wiggi mischt" : ""}` : "";
  return `🎺 ${art}: ${t.titel || ART[t.art]}\n📅 ${fmtDate(t.datum)}, ${zeit(t)}${t.ort ? `\n📍 ${t.ort}` : ""}${ton}${t.beschreibung ? `\n\n${t.beschreibung}` : ""}\n\n👉 Bitte in der App abstimmen – „Ich kann“ oder „Ich kann nicht“${t.frist ? ` bis ${fristText(t)}` : ""}:\n${link}`;
}
function teilenDialog(t, neu) {
  const serie = neu && t.art === "probe" ? D().termine.filter(x => x.art === "probe" && x.titel === t.titel && x.von === t.von && x.frist === t.frist && x.datum >= t.datum && x.status === "aktiv").sort(sortT) : [t];
  const text = serie.length > 1
    ? `🎺 Neue Proben: ${t.titel || "Probe"}, ${zeit(t)}${t.ort ? `, ${t.ort}` : ""}\n${serie.map(x => `📅 ${fmtDate(x.datum)}`).join("\n")}\n\n👉 Bitte in der App bei jeder Probe abstimmen${t.frist ? ` – bis ${fristText(t)}` : ""}:\n${APP_URL.split("#")[0]}#/t/${t.id}`
    : teilenText(t);
  const o = dialog(`<h1 style="margin-top:0">${neu ? "Gespeichert – jetzt teilen?" : "In der Gruppe teilen"}</h1>
    <p class="small muted">Der Termin geht als eine Nachricht in eure WhatsApp-Gruppe. Jeder tippt auf den Link und stimmt in der App mit <b>Kann</b> oder <b>Kann nicht</b> ab – die Ergebnisse siehst du sofort hier im Termin.</p>
    <pre class="small" style="white-space:pre-wrap;font-family:inherit;background:var(--card2);padding:10px;border-radius:8px;margin:8px 0">${esc(text)}</pre>
    <div class="actions"><a class="btn primary" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">In WhatsApp teilen</a>
    ${navigator.share ? `<button data-share>Andere App …</button>` : ""}<button data-kopie>Text kopieren</button></div>
    <p class="hint">WhatsApp fragt nach dem Empfänger – dort eure Bandgruppe auswählen.</p>`);
  o.querySelector("[data-kopie]").onclick = async () => { try { await navigator.clipboard.writeText(text); toast("Text kopiert – in die WhatsApp-Gruppe einfügen"); } catch { toast("Kopieren nicht möglich – bitte den WhatsApp-Button nutzen"); } };
  o.querySelector("[data-share]")?.addEventListener("click", async () => { try { await navigator.share({ text }); } catch { } });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-teilen]"); if (b) { const t = D().termine.find(x => x.id === b.dataset.teilen); if (t) teilenDialog(t, false); } });

// Reihenfolge in der Besetzung: erst Lücken (jemand fehlt), dann offene Antworten, dann der Rest
const rang = r => r.state === "luecke" ? 0 : (r.state === "offen" || r.offen.length) ? 1 : r.optional ? 3 : 2;
const zeitpunkt = ts => { if (!ts) return ""; const d = new Date(ts); const z = n => String(n).padStart(2, "0"); return `${z(d.getHours())}:${z(d.getMinutes())} Uhr, ${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()}`; };
function antwortListe(t, r) {
  const darf = darfFuerAndere(t);
  const zeile = (name, st, ts, extra = "", mid = null, von = null) => {
    const [farbe, wort] = st === "zu" ? ["var(--ok)", "✓ kann"] : st === "ab" ? ["var(--bad)", "✗ keine Zeit"] : ["var(--gold)", "? noch keine Antwort"];
    const vonName = von ? D().mitglieder.find(x => x.id === von)?.name : "";
    const statusEl = darf && mid ? `<button class="an-btn" style="color:${farbe}" data-statusdlg="${t.id}|${mid}" aria-label="Status von ${name} ändern">${wort} <span class="an-stift">ändern</span></button>` : `<span style="color:${farbe};font-weight:600">${wort}</span>`;
    return `<li><span class="an-name">${name}${extra}</span>${statusEl}${ts ? `<em class="an-zeit">${zeitpunkt(ts)}${vonName ? ` · eingetragen von ${esc(vonName)}` : ""}</em>` : ""}</li>`;
  };
  return `<ul class="antw">${r.mem.map(m => { const a = antwort(t, m.id); const k = a?.kommentar ? `<span class="an-kom">„${esc(a.kommentar)}“</span>` : ""; return zeile(esc(m.name), a?.status, a?.updated_at, k, m.id, a?.eingetragen_von); }).join("")}
    ${r.aus.filter(a => a.status !== "zurueckgezogen").map(a => zeile(`${esc(a.aushilfe_name)} <span class="muted small">(Aushilfe)</span>`, a.status === "offen" ? null : a.status, a.status === "offen" ? null : a.beantwortet_am)).join("")}</ul>`;
}

      ${meineA?.status === "zu" ? `<p style="color:var(--ok);margin:0 0 4px"><b>Du hast zugesagt – danke!</b></p>` : meineA?.status === "ab" ? `<p style="color:var(--bad);margin:0 0 4px"><b>Du hast abgesagt.</b></p>` : `<p style="margin:0 0 4px;font-size:18px"><b>Hast du Zeit?</b></p>`}
      <div class="actions antwort-gross"><button class="zu ${meineA?.status === "zu" ? "on" : ""}" data-antwort="zu" data-t="${t.id}">✓ Ich kann</button><button class="ab ${meineA?.status === "ab" ? "on" : ""}" data-antwort="ab" data-t="${t.id}">✗ Ich kann nicht</button></div>
      <p class="hint">Du kannst deine Antwort hier jederzeit ändern.${meineA?.updated_at ? ` <em>Zuletzt: ${zeitpunkt(meineA.updated_at)}</em>` : ""}</p>
      <label for="kom">Bemerkung (optional) – sehen alle in der Besetzung</label>

/* ---------- Probenübersicht ---------- */
function fristInfo(t) {
  if (!t.frist) return { txt: "keine Frist", sub: "", cls: "f-keine" };
  if (t.frist_uhrzeit) {
    const std = Math.floor((fristTs(t) - Date.now()) / 3600e3);
    const d = `${kurzDatum(t.frist)} ${t.frist_uhrzeit}`;
    if (std < 0) return { txt: `bis ${d}`, sub: "Frist vorbei", cls: "f-vorbei" };
    if (std < 48) return { txt: `bis ${d}`, sub: std < 1 ? "unter 1 Std." : `noch ${std} Std.`, cls: std <= 24 ? "f-knapp" : "f-ok" };
  }
  const tage = Math.round((Date.parse(t.frist + "T12:00:00") - Date.parse(today() + "T12:00:00")) / 864e5);
  const d = new Date(t.frist + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
  if (tage < 0) return { txt: `bis ${d}`, sub: "Frist vorbei", cls: "f-vorbei" };
  if (tage === 0) return { txt: `bis ${d}`, sub: "heute", cls: "f-knapp" };
  if (tage === 1) return { txt: `bis ${d}`, sub: "morgen", cls: "f-knapp" };
  return { txt: `bis ${d}`, sub: `noch ${tage} Tage`, cls: tage <= 3 ? "f-knapp" : "f-ok" };
}

function offeneJeMusiker(ps) {
  return D().mitglieder.filter(m => !istPlatzhalter(m)).map(m => ({ m, ts: ps.filter(t => eingeladen(t).some(x => x.id === m.id) && !antwort(t, m.id)) })).filter(x => x.ts.length);
}
const WT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const kurzDatum = d => { const x = new Date(d + "T12:00:00"); return `${WT[x.getDay()]} ${d.slice(8, 10)}.${d.slice(5, 7)}.`; };

      <tr class="sum"><th class="sticky">Besetzung</th>${ps.map(t => { const [f, w] = stKurz[besetzung(t).st]; return `<td><span style="color:${f};font-weight:700">●</span><div class="pzeit">${w}</div></td>`; }).join("")}</tr></tbody>

  app().querySelectorAll("[data-seite]").forEach(b => b.onclick = () => { location.hash = `#/anwesenheit?art=${art}&seite=${b.dataset.seite}`; });

function viewAuswertung() {
  const q = new URLSearchParams(location.hash.split("?")[1] || "");

  const bis = q.get("bis") || today().slice(0, 4) + "-12-31";
  const art = q.get("art") || "probe";
  const basis = q.get("basis") === "anwesenheit" ? "anwesenheit" : "zusagen";
  const artName0 = { probe: ["Probe", "Proben"], anfrage: ["Anfrage", "Anfragen"], auftritt: ["Auftritt", "Auftritte"] }[art] || ["Probe", "Proben"];
  // Anfragen: auch abgesagte zählen (die Verfügbarkeit wurde trotzdem abgefragt); Proben/Auftritte: ohne abgesagte
  const termine = D().termine.filter(t => t.datum >= von && t.datum <= bis && t.art === art && (art === "anfrage" || t.status !== "abgesagt") && (basis === "zusagen" || t.datum <= today())).sort((a, b) => a.datum.localeCompare(b.datum));
  const wert = (t, mid) => basis === "anwesenheit" ? (anw(t, mid) ? (anw(t, mid).anwesend ? "zu" : "ab") : null) : antwort(t, mid)?.status;
  const W = basis === "anwesenheit" ? { zu: "da", ab: "nicht da", of: "nicht erfasst" } : { zu: "dabei", ab: "keine Zeit", of: "noch keine Antwort" };
  const rows = D().mitglieder.map(m => {
    const ts = termine.filter(t => eingeladen(t).some(x => x.id === m.id));
    const zu = ts.filter(t => wert(t, m.id) === "zu").length;
    const ab = ts.filter(t => wert(t, m.id) === "ab").length;
    return { m, ts, zu, ab, offen: ts.length - zu - ab };

  const zeitraum = `${datumJ(von)} – ${datumJ(bis)}`;

      <div><label>Grundlage</label><select name="basis"><option value="zusagen" ${basis === "zusagen" ? "selected" : ""}>Zu- und Absagen</option><option value="anwesenheit" ${basis === "anwesenheit" ? "selected" : ""}>tatsächliche Anwesenheit</option></select></div></div>
      <div class="grid2"><div><label>Von</label><input type="date" name="von" value="${von}"></div><div><label>Bis</label><input type="date" name="bis" value="${bis}"></div></div>
      <div class="actions"><button class="primary mini">Anzeigen</button></div>
    </form>
    ${rows.length ? `
      <p class="small" style="margin:0 0 4px"><b>${termine.length} ${artName0[termine.length === 1 ? 0 : 1]}</b> vom ${zeitraum} · Grundlage: <b>${basis === "anwesenheit" ? "tatsächliche Anwesenheit" : "Zu- und Absagen"}</b> <span class="muted">(${art === "anfrage" ? "inkl. abgesagter Anfragen; zugesagte zählen bei Auftritte" : "ohne abgesagte"}${basis === "anwesenheit" ? ", nur vergangene Termine" : ""})</span></p>
      <p class="small muted" style="margin:0 0 12px">Danke an alle, die sich die Zeit nehmen! Ein „keine Zeit“ ist völlig normal – viele von uns spielen noch in anderen Vereinen oder haben Familie.</p>
      <div class="row small" style="gap:14px;flex-wrap:wrap;margin-bottom:10px">

        <span><i class="lgd" style="background:transparent;border:1px dashed var(--line2)"></i>${W.of}</span>
      </div>
      ${rows.map(r => { const n = r.ts.length, pz = 100 * r.zu / n, pa = 100 * r.ab / n, po = 100 - pz - pa; return `

        <div class="row" style="justify-content:space-between"><b>${esc(r.m.name)}</b><span class="small muted">${basis === "anwesenheit" ? "da bei" : "dabei bei"} <b style="color:var(--text)">${r.zu}</b> von ${n}</span></div>
        <div class="sbar" role="img" aria-label="${esc(r.m.name)}: ${r.zu} ${W.zu}, ${r.ab} ${W.ab}, ${r.offen} ${W.of}">
          <i style="width:${pz}%;background:var(--gold)"></i><i style="width:${pa}%;background:#4A4A4A"></i><i style="width:${po}%;background:transparent"></i>
        </div>

      </div>`; }).join("")}

}

  }));
}

/* ---------- Kalender (.ics) ---------- */
function icalUrl() {
  if (S.mode === "demo") return "https://<euer-projekt>.supabase.co/functions/v1/ical?key=… (Beispiel – im Echtbetrieb steht hier die echte Adresse)";
  const key = (D().einstellungen || []).find(e => e.schluessel === "ical_key")?.wert;
  return key ? `${CFG.supabaseUrl}/functions/v1/ical?key=${key}` : "Noch nicht eingerichtet – bitte Christoph oder Michael fragen.";
}
function icsDownload() {
  const p = s => String(s || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const dt = (d, t) => d.replace(/-/g, "") + (t ? "T" + t.replace(":", "") + "00" : "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Urban Brassmusix//Termine//DE", "X-WR-CALNAME:Brassmusix", "X-WR-TIMEZONE:Europe/Berlin"];
  D().termine.filter(t => t.status !== "abgesagt").forEach(t => {
    lines.push("BEGIN:VEVENT", `UID:${t.id}@brassmusix`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`);
    if (t.von) { lines.push(`DTSTART;TZID=Europe/Berlin:${dt(t.datum, t.von)}`); lines.push(`DTEND;TZID=Europe/Berlin:${dt(t.datum, t.bis || t.von)}`); }
    else { lines.push(`DTSTART;VALUE=DATE:${dt(t.datum)}`); lines.push(`DTEND;VALUE=DATE:${dt(addDays(t.datum, 1))}`); }
    lines.push(`SUMMARY:${p((t.art === "anfrage" ? "[Anfrage] " : "") + (t.titel || ART[t.art]))}`);
    if (t.ort) lines.push(`LOCATION:${p(t.ort)}`);
    if (t.beschreibung) lines.push(`DESCRIPTION:${p(t.beschreibung)}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  download(new Blob([lines.join("\r\n")], { type: "text/calendar" }), "brassmusix.ics");
}

async function route() {
  const h = location.hash || "#/";
  $("#fb").style.display = (S.mode === "demo" || (CFG.feedbackImLiveBetrieb && (CFG.feedbackTelefon || CFG.feedbackEmail))) ? "" : "none";
  $("#fb").style.bottom = me && !(location.hash || "").startsWith("#/antwort/") ? "" : "calc(16px + env(safe-area-inset-bottom))";
  const path = h.slice(1).split("?")[0];
  if (path.startsWith("/antwort/")) { $("#fab").style.display = "none"; return viewAntwort(path.split("/")[2]); }
  if (!me) { if (path.startsWith("/t/")) lsSet("bmx-ziel", "#" + path); renderHeader(); return viewLogin(); }
  if (me.unbekannt) { renderHeader(); app().innerHTML = `<div class="card"><h1>Noch nicht freigeschaltet</h1><p>Die Adresse <b>${esc(me.email)}</b> ist keinem Mitglied zugeordnet. Bitte Christoph oder Michael, sie unter Verwaltung einzutragen.</p></div>`; return; }
  renderHeader();
  if (path === "/" || path === "") return viewListe();
  if (path.startsWith("/t/")) return viewDetail(path.split("/")[2]);
  if (path === "/neu") return viewForm(null);
  if (path.startsWith("/edit/")) return viewForm(path.split("/")[2]);
  if (path === "/auswertung") return sehenStat() ? viewAuswertung() : (app().innerHTML = `<p>Dafür fehlt dir das Recht. Christoph oder Michael können es freigeben.</p>`);
  if (path === "/anwesenheit") return viewAnwesenheit();
  if (path === "/verwaltung") return viewVerwaltung();
  viewListe();
}

document.addEventListener("click", async e => {
  const f = e.target.closest("[data-filter]");
  if (f) { filter = f.dataset.filter; lsSet("bmx-filter", filter); viewListe(); return; }
  const bm = e.target.closest("[data-bemerkung]");
  if (bm && me?.id) {
    const t = D().termine.find(x => x.id === bm.dataset.bemerkung);
    if (!t) return;
    const a = antwort(t, me.id);
    const o = dialog(`<h2 style="margin-top:0">${esc(t.titel || ART[t.art])}</h2>
      <p class="small muted" style="margin:0 0 8px">${fmtDate(t.datum)}, ${esc(zeit(t))}</p>
      <label for="bemtext">Bemerkung (optional) – sehen alle in der Besetzung</label>
      <textarea id="bemtext" rows="3" placeholder="z. B. komme 30 Min. später · nur bis 22 Uhr">${esc(a?.kommentar || "")}</textarea>
      <p class="small" style="margin:10px 0 6px"><b>Und deine Antwort:</b></p>
      <div class="actions antwort-gross" style="margin-top:0"><button class="zu ${a?.status === "zu" ? "on" : ""}" data-antwort="zu" data-t="${t.id}">✓ Ich kann</button><button class="ab ${a?.status === "ab" ? "on" : ""}" data-antwort="ab" data-t="${t.id}">✗ Ich kann nicht</button></div>`);
    o.id = "bemerkdlg";
    setTimeout(() => o.querySelector("textarea")?.focus(), 50);
    return;
  }
  const b = e.target.closest("[data-antwort]");
  if (b && me?.id) {
    const t = D().termine.find(x => x.id === b.dataset.t);
    if (!t || !antwortMoeglich(t)) { toast("Für diesen Termin ist keine Rückmeldung mehr möglich."); return; }
    const alt = antwort(t, me.id);
    const feld = b.closest("#bemerkdlg")?.querySelector("textarea") || (location.hash.startsWith("#/t/") ? $("#kom") : null);
    const kommentar = feld ? feld.value.trim() : (alt?.kommentar || "");
    await S.upsert("rueckmeldungen", { termin_id: t.id, mitglied_id: me.id, status: b.dataset.antwort, kommentar, updated_at: new Date().toISOString(), eingetragen_von: null });
    if (b.closest("#bemerkdlg")) { b.closest("#bemerkdlg").remove(); toast(kommentar ? "Antwort mit Bemerkung gespeichert" : "Antwort gespeichert"); }
    if (b.dataset.antwort === "ab" && alt?.status === "zu") {
      const rolle = t.art === "probe" ? "proben" : "auftritte";
      const orga = D().mitglieder.filter(m => m.rollen.includes(rolle) && m.id !== me.id).map(m => m.id);
      S.notify(orga, `Absage nach Zusage: ${me.name}`, `${t.titel} am ${fmtDate(t.datum)} – Aushilfe nötig?`, `#/t/${t.id}`);
    }
  }
});

/* ---------- Start ---------- */
(async () => {
  try {
    if (!LIVE && !CFG.demoErlaubt) {
      app().innerHTML = `<div class="card"><h1>App noch nicht eingerichtet</h1><p>Die Verbindung zur Datenbank fehlt. Bitte Christoph oder Michael Bescheid geben.</p><p class="hint">Für Christoph/Michael: in <code>index.html</code> oben bei <code>BMX_CONFIG</code> die Werte <code>supabaseUrl</code> und <code>supabaseAnonKey</code> eintragen (ANLEITUNG.md, Schritt 5).</p></div>`;
      return;
    }
    S = LIVE ? await LiveStore() : DemoStore();
    await S.init();
    me = await S.currentMember();
    S.onChange(async () => { if (S.mode === "live") me = await S.currentMember(); if (!(location.hash || "").startsWith("#/antwort/")) route(); });
    window.addEventListener("hashchange", route);
    route();
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { });
  } catch (e) {
    app().innerHTML = `<div class="card"><h1>Fehler beim Start</h1><p class="muted">${esc(e.message)}</p></div>`;
  }
})();
</script>
